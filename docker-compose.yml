version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: verirag_postgres
    restart: always
    environment:
      POSTGRES_USER: verirag_user
      POSTGRES_PASSWORD: verirag_password
      POSTGRES_DB: verirag_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - verirag_network

  # 2. FastAPI Intelligence Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: verirag_backend
    restart: always
    environment:
      - JWT_SECRET=verirag_super_secure_jwt_secret_key_2026_enterprise
      - DATABASE_URL=sqlite:///storage/verirag.db
      - LLM_MODEL=gemini-1.5-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    depends_on:
      - postgres
    networks:
      - verirag_network

  # 3. React + Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verirag_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - verirag_network

volumes:
  pgdata:

networks:
  verirag_network:
    driver: bridge
